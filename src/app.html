<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0e141d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e141d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%sveltekit.assets%/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/brand/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/brand/apple-touch-icon.png" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
